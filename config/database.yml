default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 8) %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "workspace") %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: seo_workspace_development
test:
  <<: *default
  database: seo_workspace_test
production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "seo_workspace") %>
